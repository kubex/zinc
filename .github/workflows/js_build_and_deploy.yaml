name: "Release"
on:
  push:
    branches:
      - master
    paths:
      - package.json

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - id: check
        run: |
          local=$(node -p "require('./package.json').version")
          published=$(npm view @kubex/zinc version 2>/dev/null || echo none)
          echo "local=$local published=$published"
          echo "changed=$([ "$local" != "$published" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: [ version ]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # Check out the repository

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - run: npm ci # Install dependencies

      - run: npm run build # Build the site

      # Store the dist folder
      - uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: dist

  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release
        id: release
        uses: justincy/github-action-npm-release@2.0.2

        # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

        # Get the dist folder
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: app-build
          path: dist

      - run: npm publish --access public --provenance

  docs:
    needs: [ version ]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-docs-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - run: npm ci

      - run: npm run build -- --with-docs

      - run: cp -r dist/ _site/dist

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: './_site'
          exclude_assets: '.github,**/.gitignore'
          cname: zinc.style
