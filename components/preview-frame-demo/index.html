<!DOCTYPE html>
<html lang="en" data-layout="full-page" data-zinc-version="1.1.78">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A demo embed page implementing the hp-preview postMessage protocol, for iframing into zn-preview-frame examples."
    />
    <title>Preview Frame — Demo Embed</title>

    <script type="module" src="/dist/zn.min.js"></script>
    <link rel="stylesheet" href="/dist/zn.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&amp;display=swap" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: var(--zn-font-sans, 'Inter', sans-serif);
        background: rgb(var(--zn-body));
        color: rgb(var(--zn-text));
      }

      /* The page content fills the viewport — no docs chrome, no code preview. */
      .full-page {
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <div class="full-page">
      <div class="shell">
        <p id="waiting">Waiting for the host…</p>

        <div class="card" id="card" hidden="">
          <div class="card__accent"></div>
          <h2 id="merchant">Merchant</h2>
          <p class="card__amount" id="amount">£24.99</p>
          <label
            >Card number
            <input type="text" placeholder="4242 4242 4242 4242" disabled="" />
          </label>
          <div class="card__row">
            <label
              >Expiry
              <input type="text" placeholder="12/28" disabled="" />
            </label>
            <label
              >CVC
              <input type="text" placeholder="123" disabled="" />
            </label>
          </div>
          <div class="card__lines" id="lines"></div>
          <button id="pay" type="button">Pay now</button>
        </div>
      </div>

      <style>
        .shell {
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* A page taller than the frame: top-aligned, or the overflow clips the top. */
        .shell--tall {
          height: auto;
          align-items: flex-start;
          padding: 24px 0;
        }

        #waiting {
          color: rgb(var(--zn-color-muted-text));
        }

        .card {
          --accent: #6936f5;
          width: 320px;
          padding: 24px;
          border: 1px solid rgb(var(--zn-border-color));
          border-radius: 12px;
          background: rgb(var(--zn-panel));
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .card__accent {
          height: 6px;
          border-radius: 3px;
          background: var(--accent);
        }

        .card h2 {
          margin: 0;
          font-size: 1.125rem;
        }

        .card__amount {
          margin: 0;
          font-size: 1.75rem;
          font-weight: 700;
        }

        .card label {
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 0.75rem;
          font-weight: 600;
        }

        .card input {
          padding: 8px 10px;
          border: 1px solid rgb(var(--zn-border-color));
          border-radius: 6px;
          font: inherit;
        }

        .card__row {
          display: flex;
          gap: 12px;
        }

        .card__lines:not(:empty) {
          display: flex;
          flex-direction: column;
          gap: 8px;
          font-size: 0.8125rem;
        }

        .card__line {
          display: flex;
          justify-content: space-between;
          padding-bottom: 8px;
          border-bottom: 1px solid rgb(var(--zn-border-color));
        }

        .card__row label {
          flex: 1;
        }

        /* id selector: zn.min.css targets native buttons at higher specificity */
        .card #pay {
          padding: 10px;
          border: 0;
          border-radius: 6px;
          background: var(--accent);
          color: #fff;
          font: inherit;
          font-weight: 600;
          cursor: pointer;
        }

        body.is-dark {
          background: #101014;
          color: #f4f4f5;
        }

        body.is-dark .card {
          background: #18181b;
          border-color: #33333a;
        }
      </style>

      <script>
        // The embed side of the hp-preview protocol: announce readiness, wait for the
        // config payload, render it, then report rendered (or error). A real embed
        // should use the host's origin instead of '*'.
        const post = message => window.parent.postMessage(message, '*');

        // Reporting a height lets the host grow the frame to fit, so an overflowing
        // page is scrolled by the panel instead of inside the frame. Measured after a
        // frame so the layout has settled.
        const postRendered = () =>
          requestAnimationFrame(() =>
            post({
              type: 'hp-preview:rendered',
              height: document.documentElement.scrollHeight
            })
          );

        const renderLines = count => {
          const lines = document.getElementById('lines');
          lines.innerHTML = '';
          document.querySelector('.shell').classList.toggle('shell--tall', count > 0);
          for (let i = 1; i <= count; i++) {
            const line = document.createElement('div');
            line.className = 'card__line';
            line.innerHTML = `<span>Line item ${i}</span><span>£${(i * 1.5).toFixed(2)}</span>`;
            lines.append(line);
          }
        };

        window.addEventListener('message', e => {
          const data = e.data;
          if (data?.type !== 'hp-preview:config') return;

          if (data.fail) {
            post({ type: 'hp-preview:error', message: data.message || 'Preview failed to render' });
            return;
          }

          document.getElementById('waiting').hidden = true;
          const card = document.getElementById('card');
          card.hidden = false;
          card.style.setProperty('--accent', data.accent || '#6936f5');
          document.getElementById('merchant').textContent = data.merchant || 'Merchant';
          document.getElementById('amount').textContent = data.amount || '';
          document.getElementById('pay').textContent = data.buttonLabel || 'Pay now';
          renderLines(Number(data.lines) || 0);
          postRendered();
        });

        // The theme half of the protocol: applied independently of the config, so
        // the editor can push values before any config exists.
        window.addEventListener('message', e => {
          const data = e.data;
          if (data?.type !== 'hp-preview:theme') return;

          const values = data.values || {};
          document.body.classList.toggle('is-dark', data.mode === 'dark');
          const card = document.getElementById('card');
          card.hidden = false;
          if (values.background) card.style.background = values.background;
          if (values.accent) card.style.setProperty('--accent', values.accent);
          if (values.radius !== undefined && values.radius !== '') {
            card.style.borderRadius = values.radius + 'px';
          }
          document.getElementById('waiting').hidden = true;
          postRendered();
        });

        post({ type: 'hp-preview:ready' });
      </script>
    </div>
  </body>
</html>
